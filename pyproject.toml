[project]
name = "pt-p750w"
version = "0.1.0"
description = "Print text labels on a Brother PT-P750W over USB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "phisaver-client>=2.1.5",
    "pillow>=13.0.0",
]

[project.scripts]
pt-print = "pt_p750w.printing:main"
pt-status = "pt_p750w.status:main"
pt-server = "pt_p750w.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# The ROS 2 PYTHONPATH injects pytest plugins (launch_testing) that fail to
# import. Disabling autoload here also covers VS Code test discovery.
addopts = ["--disable-plugin-autoload"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pt_p750w"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ['if __name__ == "__main__":']
