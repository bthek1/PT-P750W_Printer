[project]
name = "pt-p750w"
version = "0.1.0"
description = "Print text labels on a Brother PT-P750W over USB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
pt-print = "pt_p750w.printing:main"
pt-status = "pt_p750w.status:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
